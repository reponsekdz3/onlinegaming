name: CI

on:
  pull_request:
  push:
    branches: [main, "foundation/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: onlinegaming
          POSTGRES_USER: onlinegaming
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onlinegaming -d onlinegaming"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Type-check
        run: pnpm typecheck
      - name: Test domain invariants
        run: pnpm test
      - name: Apply PostgreSQL migrations
        env:
          DATABASE_URL: postgresql://onlinegaming:ci_only_password@localhost:5432/onlinegaming
        run: pnpm --filter @onlinegaming/api db:migrate
      - name: Verify ledger and rerun migrations
        env:
          DATABASE_URL: postgresql://onlinegaming:ci_only_password@localhost:5432/onlinegaming
        run: |
          pnpm --filter @onlinegaming/api db:verify
          pnpm --filter @onlinegaming/api db:migrate
